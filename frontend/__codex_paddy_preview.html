<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>稻田生长阶段预览</title>
<style>body{margin:0;background:#f4f1df;font:14px system-ui;color:#62563f}canvas{display:block}aside{position:fixed;bottom:18px;left:18px;right:18px;background:#fffaf0ed;border-radius:18px;padding:16px;box-shadow:0 5px 30px #594d3020}h1{font-size:20px;margin:0 0 6px}p{font-size:12px;margin:0 0 12px}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid #ded8c5;border-radius:10px;padding:10px;background:#f4f0df;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#8c9f6c;color:white}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<aside><h1>稻田生长阶段预览</h1><p>展示原场景中的颜色和稻苗高度，不修改账号存档或积分。</p><nav><button data-stage="0">等待播种</button><button data-stage="1">播种</button><button data-stage="2">浇水 · 嫩绿</button><button data-stage="3">第 3 天 · 青绿</button><button data-stage="4">第 10 天 · 深绿</button><button data-stage="5">第 20 天 · 渐黄</button><button data-stage="6">第 30 天 · 金黄</button></nav></aside>
<script type="module">
import * as THREE from 'three';import {buildWorld,terrainHeight} from '/clay-safari/src/world.js?v=20261003-paddy-1';import {PADDY} from '/clay-safari/src/data.js';
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,350),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#c5ddda');renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.prepend(renderer.domElement);const world=buildWorld(scene,{isMobile:false,activeIds:new Set()});
camera.position.set(PADDY.x+4,22,PADDY.z+24);camera.lookAt(PADDY.x,terrainHeight(PADDY.x,PADDY.z)-2,PADDY.z+3);
function stage(n){world.setPaddyStage(n);document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.stage)===n));renderer.render(scene,camera)}document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b)stage(Number(b.dataset.stage))};stage(0);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera)});
</script></html>
