<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小间谍 · 福福学堂</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#132a36;color:#edf7fa;font:14px system-ui;overflow:hidden}body{display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:7px 12px;background:#1d3d4d}strong{margin-right:auto}button{font:inherit;color:inherit;background:#2b5365;border:1px solid #8aa6b3;border-radius:8px;padding:8px 12px;cursor:pointer}#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#111e27}canvas{max-width:100%;max-height:100%;display:block;image-rendering:pixelated;outline:none}#loading{position:absolute;inset:0;z-index:2;background:#132a36;display:grid;place-content:center;text-align:center;padding:20px}#loading[hidden],#help[hidden]{display:none}#start{margin:15px auto}#help{position:absolute;inset:5%;z-index:3;overflow:auto;border:1px solid #8aa6b3;border-radius:14px;background:#1d3d4df8;padding:20px;line-height:1.8}nav{display:none;gap:7px;justify-content:center;flex-wrap:wrap;padding:7px;background:#1d3d4d}nav button{min-height:44px;min-width:45px;touch-action:none;user-select:none}footer{font-size:12px;padding:6px 12px;color:#c1d8e2}@media(pointer:coarse){nav{display:flex}}@media(max-width:550px){header strong{flex-basis:100%}}
</style><script src="index.js"></script></head><body><header><strong>小间谍</strong><button id="pause">暂停</button><button id="guide">玩法</button><button id="restart">新任务</button><button id="exit">保存并返回</button></header><main id="stage"><canvas id="canvas" tabindex="0" aria-label="小间谍游戏画面"></canvas><div id="loading"><h2>小间谍</h2><p id="status">正在读取任务进度…</p><button id="start" hidden>开始游戏</button></div><section id="help" hidden><h2>玩法说明</h2><p>潜入敌方基地，收集情报和装备，在直升机离开前赶到撤离点。原版共有 6 个关卡。</p><p>方向键左右或 A/D 移动；上方向键或 W 跳跃，按住能跳得更高；下方向键或 S 打开、收起降落伞；空格飞踢。贴着墙壁可以滑落、攀跳或蹬墙跳。</p><p>踩踏或飞踢能击败敌人。没有头盔的守卫需要一次攻击，戴头盔的士兵需要两次攻击。降落伞数量有限，注意画面上方的生命、情报和倒计时。</p><p>闯关进度按学习账号保存，继续时从当前关卡开头出发。失败后可以重试本关。触屏按钮支持移动、跳跃、降落伞和飞踢。</p><button id="dismiss">继续任务</button></section></main><nav aria-label="触屏操作"><button data-code="ArrowLeft">左</button><button data-code="ArrowRight">右</button><button data-code="ArrowUp">跳跃</button><button data-code="ArrowDown">降落伞</button><button data-code="Space">飞踢</button><button data-code="Enter">确认</button><button data-code="Escape">菜单</button></nav><footer>任务进度按学习账号保存；继续时从当前关卡开头出发。</footer><script type="module">
import {initialize,learnerStorage,report,closeGame} from './fufu-storage.js';
const canvas=document.querySelector('canvas'),loading=document.querySelector('#loading'),status=document.querySelector('#status'),start=document.querySelector('#start');let captureResolve;
window.FufuGodot={state:{},paused:false,capture:false,restart:false,nativeState:{},save(state){learnerStorage.setItem('little-spy.save.v1',JSON.stringify(state));},captured(){if(this.capture){this.capture=false;captureResolve?.();captureResolve=null;}}};
window.fufuBeforeClose=()=>!loading.hidden?Promise.resolve():new Promise((resolve,reject)=>{const timer=setTimeout(()=>{captureResolve=null;reject(new Error('任务未响应，请重试返回'));},4000);captureResolve=()=>{clearTimeout(timer);resolve();};FufuGodot.capture=true;});
const held=new Set(),codes={ArrowLeft:37,ArrowRight:39,ArrowUp:38,ArrowDown:40,Space:32,Enter:13,Escape:27};
function key(code,down){if(down&&FufuGodot.paused)return;down?held.add(code):held.delete(code);canvas.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{code,key:code==='Space'?' ':code,keyCode:codes[code],which:codes[code],bubbles:true}));canvas.focus();}
function pause(value){for(const code of [...held])key(code,false);FufuGodot.paused=value;document.querySelector('#pause').textContent=value?'继续':'暂停';if(!value)canvas.focus();}
document.querySelector('#pause').onclick=()=>pause(!FufuGodot.paused);document.querySelector('#guide').onclick=()=>{pause(true);document.querySelector('#help').hidden=false;};document.querySelector('#dismiss').onclick=()=>{document.querySelector('#help').hidden=true;pause(false);};document.querySelector('#exit').onclick=()=>closeGame();
document.querySelector('#restart').onclick=()=>{if(!confirm('开始新任务会清除当前闯关进度，确定吗？'))return;FufuGodot.state={};learnerStorage.setItem('little-spy.save.v1','{}');if(loading.hidden){FufuGodot.restart=true;pause(false);}};
for(const b of document.querySelectorAll('[data-code]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);key(b.dataset.code,true);};for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>key(b.dataset.code,false));}
window.addEventListener('fufu-game-close',()=>pause(true));window.addEventListener('fufu-game-reopen',()=>pause(false));document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true);});
try{await initialize();FufuGodot.state=JSON.parse(learnerStorage.getItem('little-spy.save.v1')||'{}');start.hidden=false;status.textContent='点击开始，进入任务';report('fufu-toy-ready','点击开始游戏');}catch(error){status.textContent=error.message;report('fufu-toy-error',error.message);}
start.onclick=async()=>{start.hidden=true;status.textContent='正在加载原版关卡…';try{const engine=new Engine({args:[],canvas,executable:'index',fileSizes:__SIZES__,canvasResizePolicy:2,focusCanvas:true,persistentPaths:[]});await engine.startGame({onProgress(current,total){if(total)status.textContent='正在加载 '+Math.round(current/total*100)+'%';}});loading.hidden=true;canvas.focus();report('fufu-toy-ready','进度已读取');}catch(error){status.textContent='加载失败：'+error.message;start.hidden=false;report('fufu-toy-error',error.message);}};
</script></body></html>
