<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>__TITLE__ · 福福学堂</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#15252f;color:#edf6fb;font:14px system-ui;overflow:hidden}body{display:flex;flex-direction:column}header{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:7px 12px;background:#1c3444}strong{margin-right:auto}button{color:inherit;background:#2c4859;border:1px solid #78909b;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e6be72}#stage{flex:1;min-height:0;position:relative;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#loading{position:absolute;inset:0;z-index:2;background:#15252f;display:grid;place-content:center;text-align:center;padding:20px}#loading[hidden],#help[hidden]{display:none}#start{margin:15px auto}#help{position:absolute;inset:5%;z-index:3;overflow:auto;border:1px solid #78909b;border-radius:14px;padding:20px;background:#1c3444f8;line-height:1.8}#touch{display:none;gap:6px;flex-wrap:wrap;justify-content:center;background:#1c3444;padding:7px}#touch button{min-height:44px;min-width:45px;touch-action:none;user-select:none}#typing{display:none;gap:6px;padding:7px;background:#1c3444}#typing input{flex:1;min-width:0;padding:9px;border-radius:8px;border:1px solid #78909b;font:16px system-ui}footer{font-size:12px;color:#bacdd7;padding:5px 12px}@media(pointer:coarse){body.soko #touch{display:flex}body.taipo #typing{display:flex}}@media(max-width:550px){header strong{flex-basis:100%}footer{font-size:11px}}
</style></head><body><header><strong>__TITLE__</strong><button id="pause">暂停</button><button id="guide">玩法</button><button id="exit">保存并返回</button></header><main id="stage"><div id="loading"><h2>__TITLE__</h2><p id="status">正在读取你的设置…</p><button id="start" hidden>开始游戏</button><button id="retry" hidden>重新加载</button></div><section id="help" hidden><h2>玩法说明</h2><div id="instructions"></div><button id="dismiss">继续游戏</button></section></main><nav id="touch" aria-label="触屏操作"><button data-code="ArrowLeft">左</button><button data-code="ArrowUp">上</button><button data-code="ArrowDown">下</button><button data-code="ArrowRight">右</button><button data-code="KeyZ">确认 / 下一关</button><button data-code="KeyX">撤销 / 返回</button><button data-code="KeyC">重置</button><button data-code="Escape">菜单</button></nav><form id="typing"><input id="word" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="输入英语或日语罗马音" placeholder="输入画面中的单词，按确认"><button>确认</button></form><footer id="note"></footer><script type="module">
import {initialize,learnerStorage,report,closeGame} from './fufu-storage.js';
const slug='__SLUG__',taipo=slug==='taipo',key=slug+'.save.v1';let values={},paused=false,ready=false,frame;
const start=document.querySelector('#start'),loading=document.querySelector('#loading'),status=document.querySelector('#status');
document.body.classList.add(taipo?'taipo':'soko');
document.querySelector('#instructions').innerHTML=taipo?'<p>输入行动面板或塔位上的单词，再按回车确认。输入单词可以赚取游戏币；选中塔位后，再输入面板中的词来建造、升级或出售防御塔。</p><p>首次默认练习英语，也可以在菜单选择日语假名、基础汉字或站名。练习用的英语与日语保留原文，菜单和操作说明已汉化。日语使用罗马音输入；输入 help 可以显示罗马音提示。</p><p>手里剑塔攻击单个敌人，纪念塔增强附近防御塔，咖啡塔削弱敌人的护甲。选择塔位后，按行动面板提示操作，守住终点。</p><p>保存词表选择与音量设置；每次打开开始新的一局。手机可使用下方输入框，建议横屏；日语输入罗马音即可。</p>':'<p>把所有箱子推到目标点即可过关。箱子只能推，不能拉；小心墙角，走错了可以撤销。</p><p>方向键或 WASD 移动；Z 确认、下一关，X 撤销或返回，C 重置本关，Esc 打开原作菜单。触屏按钮支持相同操作。</p><p>在主菜单用左右选择关卡包，再选择关卡。当前棋盘、撤销记录和已完成关卡按学习账号保存。原引擎的高级设置部分保留英文。</p>';
document.querySelector('#note').textContent=taipo?'保存练习词表与音量；重新打开会开始新的一局。':'当前棋盘、撤销记录和已完成关卡按学习账号保存。';
function pause(value){paused=value;document.querySelector('#pause').textContent=value?'继续':'暂停';window.FufuNative.native?.setPaused(value);if(!value)frame?.contentWindow.document.querySelector('canvas')?.focus();}
window.FufuNative={memory:{getItem(k){return values[k]??null;},setItem(k,v){if(values[k]===v)return;values[k]=String(v);learnerStorage.setItem(key,JSON.stringify(values));},removeItem(k){delete values[k];learnerStorage.setItem(key,JSON.stringify(values));}},native:null,
 ready(){ready=true;loading.hidden=true;this.native?.setPaused(paused);report('fufu-toy-ready','进度已读取');},
 error(message){status.textContent='加载失败：'+message;loading.hidden=false;document.querySelector('#retry').hidden=false;report('fufu-toy-error',message);}
};
document.querySelector('#pause').onclick=()=>pause(!paused);document.querySelector('#guide').onclick=()=>{pause(true);document.querySelector('#help').hidden=false;};document.querySelector('#dismiss').onclick=()=>{document.querySelector('#help').hidden=true;pause(false);};document.querySelector('#exit').onclick=()=>closeGame();document.querySelector('#retry').onclick=()=>location.reload();
window.addEventListener('fufu-game-close',()=>pause(true));window.addEventListener('fufu-game-reopen',()=>pause(false));document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true);});
function sendKey(code,down){if(paused||!ready)return;window.FufuNative.native?.key(code,code.startsWith('Key')?code.slice(3).toLowerCase():code,down);}
for(const b of document.querySelectorAll('[data-code]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);sendKey(b.dataset.code,true);};for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,()=>sendKey(b.dataset.code,false));}
document.querySelector('#typing').onsubmit=async event=>{event.preventDefault();if(paused||!ready)return;const input=document.querySelector('#word');await window.FufuNative.native?.text(input.value);input.value='';input.focus();};
try{await initialize();values=JSON.parse(learnerStorage.getItem(key)||'{}');start.hidden=false;status.textContent='点击开始游戏';report('fufu-toy-ready','点击开始游戏');}catch(error){window.FufuNative.error(error.message);}
start.onclick=()=>{start.hidden=true;status.textContent='正在加载原版游戏…';frame=document.createElement('iframe');frame.title='__TITLE__游戏画面';frame.allow='autoplay';frame.src='native.html';document.querySelector('#stage').append(frame);};
</script></body></html>
