<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>__TITLE__ · 福福学堂</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101b29;color:#eff7ff;font:14px system-ui,sans-serif;overflow:hidden}body{display:flex;flex-direction:column}header{height:48px;display:flex;align-items:center;gap:8px;padding:6px 14px;background:#152538}strong{margin-right:auto}button{border:1px solid #69829c;border-radius:8px;padding:7px 12px;background:#233c54;color:white;cursor:pointer}#stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100%;max-height:100%;outline:none;image-rendering:pixelated}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#101b29;z-index:2}#start{margin:18px auto}#help{position:absolute;z-index:4;inset:10%;background:#193048f5;border:1px solid #7593ad;border-radius:16px;padding:24px;overflow:auto;line-height:1.8}#help[hidden],#loading[hidden]{display:none}footer{font-size:12px;padding:5px 12px;color:#aac7dc;min-height:26px}#touch{display:none;flex-wrap:wrap;gap:7px;justify-content:center;padding:8px;background:#152538}#touch button{min-width:48px;touch-action:none;user-select:none}@media(pointer:coarse){#touch{display:flex}}#touch.star button:not([data-code="Space"]){display:none}#touch.star button[data-code="Space"]{width:70%;padding:14px}progress{width:260px}
</style><script src="__PREFIX__.js"></script></head>
<body><header><strong>__TITLE__</strong><button id="pause">暂停</button><button id="guide">玩法</button><button id="exit">保存并返回</button></header>
<main id="stage"><canvas id="canvas" tabindex="0" aria-label="__TITLE__游戏画面"></canvas><div id="loading"><h2>__TITLE__</h2><p id="status">正在读取你的进度…</p><progress id="progress"></progress><button id="start" hidden>开始游戏</button></div><section id="help" hidden><h2>玩法说明</h2><p id="instructions"></p><p id="detail"></p><button id="dismiss">继续游戏</button></section></main>
<nav id="touch" aria-label="触屏按键"><button data-code="ArrowLeft">左</button><button data-code="ArrowDown">下</button><button data-code="ArrowUp">上</button><button data-code="ArrowRight">右</button><button data-code="KeyS">跳跃</button><button data-code="KeyD">雨伞</button><button data-code="KeyA">慢走</button><button data-code="KeyW">影像</button><button data-code="KeyQ">能力</button><button data-code="Escape">菜单</button><button data-code="Space">按住行走 · 松开跳跃</button></nav><footer id="save">关卡进度按学习账号保存</footer>
<script type="module">
import {initialize,learnerStorage,flush,report,getLearnerId,closeGame} from './fufu-storage.js';
const slug='__SLUG__',star=slug==='starcatcher',key=slug+'.save.v1';
const loading=document.querySelector('#loading'),status=document.querySelector('#status'),start=document.querySelector('#start'),canvas=document.querySelector('canvas');
let resolveCapture;window.FufuGodot={learnerId:0,state:{},paused:false,capture:false,save(state){learnerStorage.setItem(key,JSON.stringify(state));},captured(){if(this.capture){this.capture=false;resolveCapture?.();resolveCapture=null;}}};
window.fufuBeforeClose=()=>loading.hidden?new Promise((resolve,reject)=>{const timer=setTimeout(()=>{resolveCapture=null;reject(new Error('游戏未响应，请重试返回'));},4000);resolveCapture=()=>{clearTimeout(timer);resolve();};window.FufuGodot.capture=true;}):Promise.resolve();
const config={args:[],canvas,executable:'__PREFIX__',fileSizes:__SIZES__,canvasResizePolicy:2,focusCanvas:true};let engine;
function pause(value){window.FufuGodot.paused=value;document.querySelector('#pause').textContent=value?'继续':'暂停';if(!value)canvas.focus();}
document.querySelector('#pause').onclick=()=>pause(!window.FufuGodot.paused);
document.querySelector('#guide').onclick=()=>{pause(true);document.querySelector('#help').hidden=false;};
document.querySelector('#dismiss').onclick=()=>{document.querySelector('#help').hidden=true;pause(false);};
document.querySelector('#exit').onclick=()=>closeGame();
document.querySelector('#instructions').textContent=star?'只用一个按键：按住 X、空格或屏幕行走，松开就会起跳。碰到星星进入下一关。获得能力后，在空中再次按下可以向下冲击或改变方向。':'方向键移动；S 跳跃，D 使用雨伞，W 全息影像（需要取得对应能力）。向下键与存档点互动。Esc 暂停并查看地图。可以在设置中修改按键。';
document.querySelector('#detail').textContent=star?'原版共有 24 个挑战关卡与结尾场景。自动保存已解锁关卡，重新打开会从本关起点继续。':'选择“新手教程”熟悉操作，或在“开始冒险”中选择内置世界。主界面、设置与存档界面已汉化；第三方关卡中的故事和图片文字保留作者原文。存档点记录的进度会同步到学习账号。';
document.querySelector('#touch').classList.toggle('star',star);if(!star)document.querySelector('[data-code="Space"]').hidden=true;
if(!star)document.querySelector('#save').textContent='请在白光存档点按向下键，保存探索进度。';
const codes={ArrowLeft:37,ArrowUp:38,ArrowRight:39,ArrowDown:40,Space:32,KeyS:83,KeyD:68,KeyA:65,KeyW:87,KeyQ:81,Escape:27};
function keyEvent(code,down){const key=code==='Space'?' ':code.startsWith('Key')?code.slice(3).toLowerCase():code;canvas.focus();canvas.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{key,code,keyCode:codes[code],which:codes[code],bubbles:true}));}
for(const button of document.querySelectorAll('[data-code]')){button.onpointerdown=e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keyEvent(button.dataset.code,true);};for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,()=>keyEvent(button.dataset.code,false));}
window.addEventListener('fufu-game-close',()=>pause(true));window.addEventListener('fufu-game-reopen',()=>pause(false));document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true);});
await initialize().then(()=>{window.FufuGodot.learnerId=getLearnerId();window.FufuGodot.state=JSON.parse(learnerStorage.getItem(key)||'{}');config.persistentPaths=star?[]:['/userfs/learner-'+getLearnerId()];if(!star)config.args=['--data','user://learner-'+getLearnerId()];status.textContent='点击开始，准备游戏';document.querySelector('progress').hidden=true;start.hidden=false;report('fufu-toy-ready','点击开始游戏');}).catch(error=>{report('fufu-toy-error',error.message);status.textContent='无法读取进度：'+error.message;});
start.onclick=async()=>{start.hidden=true;document.querySelector('progress').hidden=false;status.textContent='正在准备游戏…';try{engine=new Engine(config);await engine.startGame({onProgress(current,total){const bar=document.querySelector('progress');if(total){bar.max=total;bar.value=current;status.textContent='正在加载 '+Math.round(current/total*100)+'%';}},onPrintError(...args){console.error(...args);}});loading.hidden=true;canvas.focus();report('fufu-toy-ready','进度已读取');}catch(error){status.textContent='加载失败：'+error.message;start.hidden=false;}};
</script></body></html>
